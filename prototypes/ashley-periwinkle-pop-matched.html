n:0}.cursor{display:inline-block;width:2px;height:1em;background:#8f84b5;vertical-align:-.1em;margin-left:3px;animation:blink .9s steps(1) infinite}.cursor[hidden]{display:none}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}@keyframes blink{50%{opacity:0}}@media(max-width:760px){.key{height:137px;border-radius:25px}.face{border-radius:23px 23px 19px 19px}.action{height:100px}.story{font-size:16px}}@media(max-width:550px){body{padding:30px 20px}main{max-width:390px}.letters{grid-template-columns:repeat(3,minmax(0,1fr));gap:17px 10px}.key{height:125px}.letter .face{font-size:55px}.actions{gap:10px;margin-top:20px}.action{height:91px;border-radius:20px}.action .face{bottom:24px;border-radius:18px;padding:0 5px;gap:4px;font-size:11px;letter-spacing:-.35px}.story-space{min-height:200px;margin-top:32px}.story{font-size:14px}}@media(prefers-reduced-motion:reduce){.key,.face{transition:none}.cursor{animation:none}}
</style></head><body><main aria-label="Ashley’s keycaps"><div class="letters" aria-label="ASHLEY"><button class="key letter" style="--face:#a5b2eb;--base:#6b78b1" type="button" aria-label="Press A"><span class="face">A</span></button><button class="key letter" style="--face:#ddd7f0;--base:#b2a9cc" type="button" aria-label="Press S"><span class="face">S</span></button><button class="key letter" style="--face:#f3c2d0;--base:#d69eab" type="button" aria-label="Press H"><span class="face">H</span></button><button class="key letter" style="--face:#c6d6f3;--base:#859cc5" type="button" aria-label="Press L"><span class="face">L</span></button><button class="key letter" style="--face:#dbd4ee;--base:#aea3c5" type="button" aria-label="Press E"><span class="face">E</span></button><button class="key letter" style="--face:#f7e1ca;--base:#dabca3" type="button" aria-label="Press Y"><span class="face">Y</span></button></div><div class="actions"><button class="key action" style="--face:#d7d0ee;--base:#b0a7d4" type="button" id="story-button" aria-expanded="false" aria-controls="story"><span class="face"><span>My design story</span><span aria-hidden="true">↵</span></span></button><a class="key action" style="--face:#eeb4cc;--base:#cd8fa9" href="#selected-work"><span class="face"><span>View selected work</span><span aria-hidden="true">↗</span></span></a></div><div class="story-space" id="story" hidden><p class="story" aria-hidden="true"><span id="typed"></span><span class="cursor" hidden></span></p><p class="sr">13 years of guzheng. 10 years of violin. Music taught me how small choices change the way an experience feels.</p></div><p role="status" class="sr" id="status"></p></main><script>
(()=>{const text="13 years of guzheng. 10 years of violin.\n\nMusic taught me how small choices change the way an experience feels.",button=document.querySelector('#story-button'),container=document.querySelector('#story'),typed=document.querySelector('#typed'),cursor=document.querySelector('.cursor'),status=document.querySelector('#status'),reduced=matchMedia('(prefers-reduced-motion: reduce)');let raf=0,typing=false,start=null;function finish(){typing=false;typed.textContent=text;cursor.hidden=true;status.textContent='Design story revealed.'}function step(t){if(start===null)start=t;const n=Math.min(text.length,Math.floor((t-start)/27));typed.textContent=text.slice(0,n);if(n<text.length)raf=requestAnimationFrame(step);else finish()}button.addEventListener('click',()=>{cancelAnimationFrame(raf);if(typing){finish();return}container.hidden=false;button.setAttribute('aria-expanded','true');typed.textContent='';status.textContent='';start=null;if(reduced.matches){finish();return}typing=true;cursor.hidden=false;raf=requestAnimationFrame(step)});document.querySelectorAll('.letter').forEach(key=>{let timer;key.addEventListener('click',()=>{clearTimeout(timer);key.classList.add('pressed');timer=setTimeout(()=>key.classList.remove('pressed'),200)})});reduced.addEventListener('change',()=>{if(typing&&reduced.matches){cancelAnimationFrame(raf);finish()}})})();
